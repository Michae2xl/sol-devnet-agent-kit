name = "sol-devnet-fee-relay"
main = "src/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Bind a KV namespace for rate-limit + per-wallet dedup.
# Create it once with:
#   wrangler kv namespace create RELAY_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "RELAY_KV"
id = "ecde3ce600a94ebfa0e3dc7dfcec4e68"

[vars]
RPC_URL = "https://api.devnet.solana.com"
SPONSOR_LAMPORTS = "11000000"          # 0.011 SOL
DAILY_IP_LIMIT = "5"
MAX_DEST_BALANCE_LAMPORTS = "0"        # only sponsor fresh (zero-balance) wallets

# Hot wallet secret — set with:
#   wrangler secret put RELAY_KEYPAIR_JSON
# Value format: JSON array of 64 ints (Solana keypair file contents).
# DO NOT commit the keypair.
